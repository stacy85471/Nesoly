<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NESOLY · Sentir bon, sans parfum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Plus Jakarta Sans (ligne finale). Outfit et Jost ne servent que de secours si Chillax / Now ne sont pas intégrées. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Outfit:wght@300;400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>

:root {
  --cream: #F2EDE6;
  --brown: #3E2E31;
  --display: "Chillax", "Outfit", sans-serif;
  --numbers: "Now", "Jost", sans-serif;
  --small: "Plus Jakarta Sans", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--brown); overflow: hidden; }
#viewport { position: fixed; inset: 0; display: grid; place-items: center; }
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1080px; height: 1920px;
  transform-origin: 50% 50%;
  overflow: hidden;
  background: var(--brown);
}
canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
.txt {
  position: absolute; left: 140px; right: 140px;
  text-align: center;
  opacity: 0;
  will-change: opacity, transform;
  font-kerning: normal;
}
.title { font-family: var(--display); font-weight: 500; font-size: 104px; line-height: 1.08; letter-spacing: -0.01em; }
.num   { font-family: var(--numbers); font-weight: 300; font-size: 54px; letter-spacing: 0.22em; text-indent: 0.22em; }
.word  { font-family: var(--display); font-weight: 500; font-size: 128px; line-height: 1; letter-spacing: -0.01em; }
.brand { font-family: var(--display); font-weight: 600; font-size: 116px; letter-spacing: 0.32em; text-indent: 0.32em; }
.small { font-family: var(--small); font-weight: 400; font-size: 30px; letter-spacing: 0.1em; text-indent: 0.1em; }
#replay {
  position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
  font-family: var(--small); font-size: 26px; letter-spacing: 0.16em; text-indent: 0.16em;
  text-transform: uppercase;
  padding: 18px 40px; border-radius: 999px;
  background: transparent; border: 1px solid currentColor;
  color: var(--brown); opacity: 0; pointer-events: none;
  transition: opacity .6s ease; cursor: pointer;
}
#replay.show { opacity: .55; pointer-events: auto; }
#replay.show:hover, #replay.show:focus-visible { opacity: .9; outline: none; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="bg" width="1080" height="1920"></canvas>
    <div id="texts"></div>
    <button id="replay" type="button">Rejouer</button>
  </div>
</div>

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);

  const colorOf = name => name === "cream" ? CREAM : BROWN;

  const XF = 0.9; // background crossfade length

  function seqWeights(t) {
    // Weight of each sequence at time t (crossfades straddle the boundaries).
    return SEQ.map((s, i) => {

        g.addColorStop(0, rgba(ink, 0.10 * a));
        g.addColorStop(1, rgba(ink, 0));

      ctx.lineWidth = 1.6;
      for (let k = 0; k < 22; k++) {
        const y0 = 120 + k * 80;
        const amp = 10 + 8 * Math.sin(k * 0.7 + t * 0.3);
        ctx.strokeStyle = rgba(ink, (0.07 + 0.05 * Math.sin(k * 1.3)) * a);
        ctx.beginPath();
        for (let x = -20; x <= W + 20; x += 12) {
          const y = y0 + amp * Math.sin(x / 210 + t * 0.6 + k * 0.45) + 6 * Math.sin(x / 90 - t * 0.9);
          x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    },
    drops(t, ink, a) {
      for (let k = 0; k < 16; k++) {
        const rnd = Math.sin(k * 91.7) * 0.5 + 0.5;
        const size = 22 + 46 * rnd;
        const speed = 18 + 26 * (1 - rnd);
        const x = 80 + ((k * 0.618) % 1) * (W - 160) + 14 * Math.sin(t * 0.5 + k);
        const y = ((k * 157 + t * speed) % (H + 300)) - 150;
        drawDrop(x, y, size, rgba(ink, 0.06 * a));
      }
    },
    circles(t, ink, a) {
      const cx = W / 2, cy = 880;
      ctx.lineWidth = 1.4;
      for (let k = 0; k < 12; k++) {
        const r = (k * 120 + t * 32) % 1440;
        ctx.strokeStyle = rgba(ink, 0.16 * a * (1 - r / 1440));
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    },
    warmth(t, ink, a) {
      for (let k = 0; k < 2; k++) {
        const x = W * (0.25 + 0.5 * k), y = H * (0.3 + 0.35 * k);
        const r = 620 + 120 * Math.sin(t * 0.5 + k * 1.7);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(ink, 0.11 * a));
        g.addColorStop(1, rgba(ink, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }
      // Slanted beams of soft light, like the sun on the bathrobe.
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.rotate(-0.62);
      for (let k = 0; k < 3; k++) {
        const off = -700 + k * 420 + 40 * Math.sin(t * 0.3 + k);
        const g = ctx.createLinearGradient(off - 90, 0, off + 90, 0);
        g.addColorStop(0, rgba(ink, 0));
        g.addColorStop(0.5, rgba(ink, 0.06 * a));
        g.addColorStop(1, rgba(ink, 0));
        ctx.fillStyle = g;
        ctx.fillRect(off - 90, -1600, 180, 3200);
      }
      ctx.restore();
    },
    finale(t, ink, a) {
      MOTIFS.circles(t * 0.6, ink, a * 0.6);
      if (t > 2.9) traceLine(t - 2.9, ink, a, 975, 0.8);
    },
  };

  function traceLine(t, ink, a, y, dur) {
    const p = easeOut((t - 0.4) / (dur * 2));
    if (p <= 0) return;
    const half = 120 * p;
    ctx.strokeStyle = rgba(ink, 0.5 * a);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(W / 2 - half, y);
    ctx.lineTo(W / 2 + half, y);
    ctx.stroke();
  }

  function drawDrop(x, y, s, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x, y - s * 1.35);
    ctx.bezierCurveTo(x + s * 0.2, y - s * 0.75, x + s, y - s * 0.2, x + s, y + s * 0.25);
    ctx.arc(x, y + s * 0.25, s, 0, Math.PI, false);
    ctx.bezierCurveTo(x - s, y - s * 0.2, x - s * 0.2, y - s * 0.75, x, y - s * 1.35);
    ctx.fill();
  }

  // Arch-shaped window holding the duotone photo.
  const ARCH = { x: 240, y: 470, w: 600, h: 820 };
  function archPath(pad = 0) {
    const { x, y, w, h } = ARCH;
    const r = w / 2 + pad;
    ctx.beginPath();
    ctx.moveTo(x - pad, y + h + pad);
    ctx.lineTo(x - pad, y + r - pad);
    ctx.arc(x + w / 2, y + r - pad, r, Math.PI, 0);
    ctx.lineTo(x + w + pad, y + h + pad);
    ctx.closePath();
  }

  function drawPhoto(seq, lt, a, ink) {
    const img = images[seq.photo];
    const d = seq.end - seq.start;
    const vis = smooth((lt - 0.5) / 1.2) * (1 - smooth((lt - (d - 1.2)) / 0.9));
    if (vis <= 0) return;
    ctx.save();
    ctx.globalAlpha = a * vis;
    archPath();
    ctx.clip();
    if (img) {
      const z = 1.04 + 0.08 * (lt / d);
      const iw = ARCH.w * z, ih = iw * img.height / img.width;
      const dx = ARCH.x + ARCH.w / 2 - iw / 2 + 12 * Math.sin(lt * 0.2);
      const dy = ARCH.y + ARCH.h / 2 - ih / 2 - 18 * (lt / d);
      ctx.drawImage(img, dx, dy, iw, ih);
    }
    ctx.restore();
    // Fine outline that draws itself around the arch.
    const p = easeOut((lt - 0.8) / 3.2);
    if (p > 0) {
      ctx.save();
      ctx.globalAlpha = a * vis;
      ctx.strokeStyle = rgba(ink, 0.45);
      ctx.lineWidth = 1.3;
      const len = 2 * ARCH.h + Math.PI * (ARCH.w / 2 + 22) + 4 * 22;
      ctx.setLineDash([len * p, len]);
      archPath(22);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ------------------------------------------------------------------ render
  function render(t) {
    const wts = seqWeights(t);
    // Background: mix of the active sequences' colours.
    let col = colorOf(SEQ[0].bg), acc = 0;
    SEQ.forEach((s, i) => {
      if (wts[i] <= 0) return;
      acc += wts[i];
      col = mix(col, colorOf(s.bg), wts[i] / acc);
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgb(${col})`;
    ctx.fillRect(0, 0, W, H);

    SEQ.forEach((s, i) => {
      if (wts[i] <= 0) return;
      const lt = t - s.start, ink = inkOf(s.bg);
      ctx.save();
      MOTIFS[s.motif](Math.max(lt, 0) + 0.001, ink, wts[i]);
      ctx.restore();
      if (s.photo) drawPhoto(s, lt, wts[i], ink);
    });

    for (const d of els) {
      const fin = easeOut((t - d.start) / 1.1);
      const fout = 1 - smooth((t - (d.end - 0.55)) / 0.55);
      const o = Math.max(0, Math.min(fin, fout));
      d.el.style.opacity = o.toFixed(3);
      if (o > 0) {
        const seq = seqAt(d.start);
        d.el.style.color = `rgb(${inkOf(seq.bg)})`;
        const lift = (1 - fin) * 24;
        d.el.style.top = d.y + "px";
        d.el.style.transform = `translateY(calc(-50% + ${lift.toFixed(2)}px))`;
        d.el.style.filter = fin < 1 ? `blur(${((1 - fin) * 6).toFixed(2)}px)` : "none";
      }
    }
    replay.style.color = `rgb(${inkOf(seqAt(t).bg)})`;
  }

  // ------------------------------------------------------------------ layout & playback
  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener("resize", fit);
  fit();

  let t0 = null, raf = 0;
  function frame(now) {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    render(Math.min(t, DURATION));
    if (t < DURATION) raf = requestAnimationFrame(frame);
    else replay.classList.add("show");
  }
  function play() {
    cancelAnimationFrame(raf);
    replay.classList.remove("show");
    t0 = null;
    raf = requestAnimationFrame(frame);
  }
  replay.addEventListener("click", play);

  const capture = new URLSearchParams(location.search).has("capture");
  // Hook used to export the animation frame by frame.
  window.NESOLY = { render, DURATION, ready: Promise.all([document.fonts.ready, loadImages]) };
  render(0);
  if (!capture) window.NESOLY.ready.then(play);
})();
</script>
</body>
</html>
